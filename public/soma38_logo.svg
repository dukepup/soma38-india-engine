<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" fill="none">
  <defs>
    <linearGradient id="somaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#e85d04"/>
      <stop offset="100%" stop-color="#9e1b32"/>
    </linearGradient>
    <linearGradient id="somaLotus" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff9500" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#9e1b32" stop-opacity="0.08"/>
    </linearGradient>
    <radialGradient id="somaHalo" cx="50%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#ffb703" stop-opacity="0.22"/>
      <stop offset="70%" stop-color="#e85d04" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#fffdf7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Warm Chandan Ivory Canvas -->
  <rect width="240" height="240" rx="36" fill="#fffdf7" stroke="#eddcc4" stroke-width="2"/>
  <circle cx="120" cy="96" r="76" fill="url(#somaHalo)"/>

  <!-- Outer Sacred Solar-Lunar Yantra Ring -->
  <circle cx="120" cy="96" r="62" stroke="#e85d04" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.75"/>
  <circle cx="120" cy="96" r="54" stroke="url(#somaGold)" stroke-width="1.6"/>

  <!-- 8-Petal Sacred Pushpa (Lotus) Mandala -->
  <path d="M120 44 L128 70 L156 58 L142 84 L170 96 L142 108 L156 134 L128 122 L120 148 L112 122 L84 134 L98 108 L70 96 L98 84 L84 58 L112 70 Z"
        fill="url(#somaLotus)" stroke="#d9480f" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Crescent Moon (Soma / Chandra) -->
  <path d="M102 74 A26 26 0 1 0 138 118 A21 21 0 1 1 102 74 Z"
        fill="url(#somaGold)"/>

  <!-- Sacred Botanical Essence Droplet (38 Remedies) -->
  <path d="M124 72 C124 72 135 86 135 94 A11 11 0 1 1 113 94 C113 86 124 72 124 72 Z"
        fill="#9e1b32" stroke="#fffdf7" stroke-width="1.5"/>
  <circle cx="124" cy="95" r="3.5" fill="#fffdf7"/>

  <!-- Wordmark: SOMA·38 -->
  <text x="120" y="188" text-anchor="middle" font-family="'Rozha One', 'Cinzel', Georgia, serif" font-size="26" font-weight="700" letter-spacing="4" fill="#9e1b32">SOMA·38</text>

  <!-- Devanagari Sub-mark: सोम · ३८ -->
  <text x="120" y="212" text-anchor="middle" font-family="'Noto Sans Devanagari', sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#e85d04">सोम · ३८ · मनःशान्तिः</text>
</svg>
